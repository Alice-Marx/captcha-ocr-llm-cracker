<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CAPTCHA验证码生成器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 15px;
            padding: 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .nav a {
            padding: 10px 24px;
            text-decoration: none;
            color: #667eea;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-weight: 500;
            transition: all 0.3s;
        }

        .nav a:hover, .nav a.active {
            background: #667eea;
            color: white;
        }

        .content {
            padding: 30px;
        }

        .control-panel {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            align-items: flex-end;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .form-group {
            flex: 1;
            min-width: 150px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group select,
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group select:focus,
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 12px 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .level-info {
            margin-bottom: 20px;
        }

        .level-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .level-card {
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .level-card:hover {
            border-color: #667eea;
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .level-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #f0f3ff 0%, #e8ecff 100%);
        }

        .level-card h3 {
            color: #667eea;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .level-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.4;
        }

        .level-badge {
            display: inline-block;
            padding: 3px 10px;
            background: #667eea;
            color: white;
            border-radius: 12px;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .captcha-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .captcha-card {
            background: white;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .captcha-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .captcha-card img {
            width: 100%;
            height: auto;
            display: block;
            background: #f8f9fa;
        }

        .captcha-card .card-footer {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .captcha-card .captcha-text {
            font-family: 'Courier New', monospace;
            font-size: 18px;
            font-weight: bold;
            color: #333;
            letter-spacing: 3px;
        }

        .captcha-card .captcha-id {
            font-size: 11px;
            color: #999;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding: 12px 16px;
            background: #e8f5e9;
            border-radius: 8px;
            color: #2e7d32;
            font-size: 14px;
        }

        .status-bar.error {
            background: #ffebee;
            color: #c62828;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CAPTCHA验证码生成器</h1>
            <p>支持4种难度等级的验证码生成</p>
        </div>

        <nav class="nav">
            <a href="/generator" class="active">验证码生成器</a>
            <a href="/login">登录页面演示</a>
        </nav>

        <div class="content">
            <!-- 等级选择 -->
            <div class="level-info">
                <h2 style="margin-bottom: 15px; color: #333;">选择验证码等级</h2>
                <div class="level-cards" id="levelCards">
                    <div class="level-card selected" data-level="1" onclick="selectLevel(1)">
                        <span class="level-badge">Level 1</span>
                        <h3>基础文本</h3>
                        <p>最基础的纯文本验证码，没有任何视觉干扰，主要用于建立基准性能</p>
                    </div>
                    <div class="level-card" data-level="2" onclick="selectLevel(2)">
                        <span class="level-badge">Level 2</span>
                        <h3>噪点干扰</h3>
                        <p>引入随机噪点干扰，每个验证码图像中添加10-15个随机位置的干扰点，模拟轻度干扰</p>
                    </div>
                    <div class="level-card" data-level="3" onclick="selectLevel(3)">
                        <span class="level-badge">Level 3</span>
                        <h3>字符扭曲</h3>
                        <p>实现字符扭曲效果，每个字符随机旋转15-25度，大幅增加识别难度</p>
                    </div>
                    <div class="level-card" data-level="4" onclick="selectLevel(4)">
                        <span class="level-badge">Level 4</span>
                        <h3>综合复杂</h3>
                        <p>综合渐变背景和随机干扰线，近似模拟商业系统中常见的验证码复杂度</p>
                    </div>
                </div>
            </div>

            <!-- 控制面板 -->
            <div class="control-panel">
                <div class="form-group">
                    <label for="levelSelect">验证码等级</label>
                    <select id="levelSelect" onchange="updateSelectedLevel()">
                        <option value="1">Level 1 - 基础文本</option>
                        <option value="2">Level 2 - 噪点干扰</option>
                        <option value="3">Level 3 - 字符扭曲</option>
                        <option value="4">Level 4 - 综合复杂</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="countInput">生成数量 (1-2000)</label>
                    <input type="number" id="countInput" min="1" max="2000" value="4">
                </div>
                <button class="btn" onclick="generateCaptchas()" id="generateBtn">
                    生成验证码
                </button>
            </div>

            <!-- 状态栏 -->
            <div class="status-bar" id="statusBar" style="display: none;"></div>

            <!-- 验证码展示区域 -->
            <div id="captchaArea">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <rect x="3" y="3" width="18" height="18" rx="2"/>
                        <path d="M9 9h6M9 12h6M9 15h4"/>
                    </svg>
                    <p>选择等级和数量，点击"生成验证码"开始</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentLevel = 1;

        function selectLevel(level) {
            currentLevel = level;
            document.getElementById('levelSelect').value = level;

            // 更新卡片选中状态
            document.querySelectorAll('.level-card').forEach(card => {
                card.classList.remove('selected');
                if (parseInt(card.dataset.level) === level) {
                    card.classList.add('selected');
                }
            });
        }

        function updateSelectedLevel() {
            const level = parseInt(document.getElementById('levelSelect').value);
            selectLevel(level);
        }

        function showStatus(message, isError = false) {
            const statusBar = document.getElementById('statusBar');
            statusBar.textContent = message;
            statusBar.className = 'status-bar' + (isError ? ' error' : '');
            statusBar.style.display = 'flex';
        }

        function hideStatus() {
            document.getElementById('statusBar').style.display = 'none';
        }

        function showLoading() {
            document.getElementById('captchaArea').innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>正在生成验证码...</p>
                </div>
            `;
        }

        async function generateCaptchas() {
            const level = parseInt(document.getElementById('levelSelect').value);
            const count = parseInt(document.getElementById('countInput').value);

            // 参数验证
            if (count < 1 || count > 200) {
                showStatus('验证码数量必须在1-200之间', true);
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.disabled = true;
            btn.textContent = '生成中...';
            showLoading();
            hideStatus();

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ level, count })
                });

                const result = await response.json();

                if (result.success) {
                    displayCaptchas(result.data);
                    showStatus(`成功生成 ${result.data.length} 个 Level ${level} 验证码`);
                } else {
                    showStatus(result.error || '生成失败', true);
                    document.getElementById('captchaArea').innerHTML = `
                        <div class="empty-state">
                            <p>生成失败，请重试</p>
                        </div>
                    `;
                }
            } catch (error) {
                showStatus('网络错误: ' + error.message, true);
                document.getElementById('captchaArea').innerHTML = `
                    <div class="empty-state">
                        <p>网络连接失败，请检查服务器是否运行</p>
                    </div>
                `;
            } finally {
                btn.disabled = false;
                btn.textContent = '生成验证码';
            }
        }

        function displayCaptchas(captchas) {
            const grid = document.createElement('div');
            grid.className = 'captcha-grid';

            captchas.forEach(captcha => {
                const card = document.createElement('div');
                card.className = 'captcha-card';
                card.innerHTML = `
                    <img src="${captcha.image}" alt="CAPTCHA验证码">
                    <div class="card-footer">
                        <span class="captcha-text">${captcha.text}</span>
                        <span class="captcha-id">ID: ${captcha.id.slice(-8)}</span>
                    </div>
                `;
                grid.appendChild(card);
            });

            document.getElementById('captchaArea').innerHTML = '';
            document.getElementById('captchaArea').appendChild(grid);
        }

        // 初始化
        selectLevel(1);
    </script>
</body>
</html>
